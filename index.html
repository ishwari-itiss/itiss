```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JokeBox 😂 | Random Jokes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #7c3aed, #ec4899, #f97316);
            display: flex;
            flex-direction: column;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            color: white;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        header span {
            font-size: 14px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px 60px;
        }

        .joke-card {
            background: white;
            width: 100%;
            max-width: 620px;
            padding: 45px 35px;

            text-align: center;
            box-shadow: 0 20px 60px #3b076455;

        .emoji {

            background: #faf5ff;

            flex-direction: column;

            gap: 12px;
            margin-bottom: 25px;
        }

        #setup {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
        }

        #punchline {
            font-size: 18px;
            color: #7c3aed;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.06);
        }

        .new-joke {
            background: #7c3aed;
            color: white;
        }

        .copy {
            background: #f3e8ff;
            color: #6b21a8;
        }

        .counter {
            margin-top: 25px;
            color: #777;

        }

        .counter strong {
            color: #7c3aed;
        }

        footer {
            text-align: center;
            padding: 20px;

            background: #581c8740;
        }

        @media (max-width: 480px) {
            .joke-card {
                padding: 32px 20px;
            }

            h1 {
                font-size: 29px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">😂 JokeBox</div>
        <span>Daily dose of laughter!</span>
    </header>

    <main>
        <div class="joke-card">
            <div class="emoji" id="emoji">🤣</div>

            <h1>Need a Laugh?</h1>
            <p class="subtitle">Click below and let the giggles begin!</p>

            <div class="joke" aria-live="polite">
                <p id="setup">Why don't scientists trust atoms?</p>
                <p id="punchline">Because they make up everything! 😂</p>
            </div>

            <div class="buttons">
                <button class="new-joke" onclick="newJoke()">
                    🎲 Tell Me a Joke
                </button>

                <button class="copy" onclick="copyJoke()">
                    📋 Copy Joke
                </button>
            </div>

            <p class="counter">
                Jokes enjoyed: <strong id="count">0</strong>
            </p>
        </div>
    </main>

    <footer>
        Made with ❤️ and a little bit of silliness.
    </footer>

    <script>
        const jokes = [
            {
                setup: "Why don't scientists trust atoms?",
                punchline: "Because they make up everything!"
            },
            {
                setup: "Why did the computer go to the doctor?",
                punchline: "Because it had a virus!"
            },
            {
                setup: "Why was the math book sad?",
                punchline: "Because it had too many problems."
            },
            {
                setup: "What do you call a fake noodle?",
                punchline: "An impasta!"
            },
            {
                setup: "Why can't your nose be 12 inches long?",
                punchline: "Because then it would be a foot!"
            },
            {
                setup: "What do clouds wear under their clothes?",
                punchline: "Thunderwear!"
            },
            {
                setup: "Why did the bicycle fall over?",
                punchline: "Because it was two-tired!"
            },
            {
                setup: "What do you call cheese that isn't yours?",
                punchline: "Nacho cheese!"
            },
            {
                setup: "Why did the student eat their homework?",
                punchline: "Because the teacher said it was a piece of cake!"
            },
            {
                setup: "What did one wall say to the other wall?",
                punchline: "I'll meet you at the corner!"
            },
            {
                setup: "Why was the JavaScript developer sad?",
                punchline: "Because they didn't know how to null their feelings."
            },
            {
                setup: "What is a computer's favorite snack?",
                punchline: "Microchips!"
            },
            {
                setup: "Why did the scarecrow win an award?",
                punchline: "Because he was outstanding in his field!"
            },
            {
                setup: "What do you call a sleeping dinosaur?",
                punchline: "A dino-snore!"
            },
            {
                setup: "Why was the broom late?",
                punchline: "It swept in!"
            }
        ];

        let count = 0;
        let lastIndex = 0;

        function newJoke() {
            let index;

            do {
                index = Math.floor(Math.random() * jokes.length);
            } while (jokes.length > 1 && index === lastIndex);

            lastIndex = index;

            document.getElementById("setup").textContent =
                jokes[index].setup;

            document.getElementById("punchline").textContent =
                jokes[index].punchline + " 😂";

            document.getElementById("emoji").textContent =
                ["🤣", "😆", "😂", "🤪", "😹"][Math.floor(Math.random() * 5)];

            count++;
            document.getElementById("count").textContent = count;
        }

        async function copyJoke() {
            const setup = document.getElementById("setup").textContent;
            const punchline = document.getElementById("punchline").textContent;
            const text = setup + "\n" + punchline;

            try {
                await navigator.clipboard.writeText(text);
                alert("Joke copied! 😂");
            } catch (error) {
                const area = document.createElement("textarea");
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
                alert("Joke copied! 😂");
            }
        }
    </script>

</body>
</html>
